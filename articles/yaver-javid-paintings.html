<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paintings</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" type="image/x-icon" href="../favicon.png">

    <style>
        :root {
            --background: #050505;
            --glass: rgba(20, 20, 22, .58);
            --glass-heavy: rgba(24, 24, 26, .76);
            --glass-border: rgba(255, 255, 255, .11);
            --glass-highlight: rgba(255, 255, 255, .07);
            --text: #f4f4f4;
            --muted: rgba(255, 255, 255, .52);
            --radius: 22px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--background);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                Inter,
                Helvetica,
                Arial,
                sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            position: relative;
        }

        button {
            font: inherit;
            color: inherit;
        }

        .app {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
        }

        .ambient {
            position: absolute;
            inset: -12%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .ambient img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(70px) saturate(1.25);
            opacity: .42;
            transform: scale(1.18);
            transition:
                opacity .65s ease,
                transform 1.1s cubic-bezier(.2, .75, .2, 1);
        }

        .ambient::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(
                    ellipse at center,
                    rgba(0, 0, 0, .06) 0%,
                    rgba(0, 0, 0, .62) 72%,
                    rgba(0, 0, 0, .92) 100%
                );
        }

        .ambient::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 2;
            background: rgba(0, 0, 0, .28);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .top {
            position: absolute;
            z-index: 20;
            top: 22px;
            left: 22px;
            right: 22px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            pointer-events: none;
        }

        .logo {
            width: 60%;
            max-width: 180px;
            cursor: pointer;
            pointer-events: auto;
            border: 1px solid gray;
            background: #44444488;
            padding: 8px 20px;
            border-radius: 14px;
            
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 9px;
            pointer-events: auto;
        }

        .glass {
            position: relative;
            border: 1px solid var(--glass-border);
            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.095),
                    rgba(255,255,255,.025)
                );
            box-shadow:
                inset 0 1px 0 var(--glass-highlight),
                0 12px 40px rgba(0,0,0,.28);
            backdrop-filter: blur(28px) saturate(145%);
            -webkit-backdrop-filter: blur(28px) saturate(145%);
        }

        .button {
            width: 46px;
            height: 46px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            transition:
                transform .18s ease,
                background .18s ease,
                border-color .18s ease;
        }

        .button:hover {
            background: rgba(255,255,255,.12);
            border-color: rgba(255,255,255,.18);
            transform: scale(1.05);
        }

        .button:active {
            transform: scale(.91);
        }

        .button svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .selector {
            position: relative;
        }

        .selector-button {
            min-width: 205px;
            height: 46px;
            padding: 0 15px 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.095),
                    rgba(255,255,255,.025)
                );
            box-shadow:
                inset 0 1px 0 var(--glass-highlight),
                0 12px 40px rgba(0,0,0,.28);
            backdrop-filter: blur(28px) saturate(145%);
            -webkit-backdrop-filter: blur(28px) saturate(145%);
            cursor: pointer;
            transition: .2s ease;
        }

        .selector-button:hover {
            background: rgba(255,255,255,.1);
        }

        .selector-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 520;
        }

        .chevron {
            width: 15px;
            height: 15px;
            flex: 0 0 auto;
            transition: transform .25s ease;
        }

        .selector.open .chevron {
            transform: rotate(180deg);
        }

        .dropdown {
            position: absolute;
            top: calc(100% + 9px);
            right: 0;
            width: 270px;
            padding: 7px;
            border-radius: 19px;
            background: rgba(19, 19, 21, .82);
            border: 1px solid rgba(255,255,255,.12);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.06),
                0 24px 70px rgba(0,0,0,.5);
            backdrop-filter: blur(35px) saturate(150%);
            -webkit-backdrop-filter: blur(35px) saturate(150%);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-7px) scale(.98);
            transform-origin: top right;
            transition:
                opacity .18s ease,
                transform .22s cubic-bezier(.2,.8,.2,1),
                visibility .18s;
        }

        .selector.open .dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .option {
            width: 100%;
            padding: 11px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            border: 0;
            border-radius: 13px;
            background: transparent;
            cursor: pointer;
            transition: background .15s ease;
        }

        .option:hover {
            background: rgba(255,255,255,.075);
        }

        .option.active {
            background: rgba(255,255,255,.1);
        }

        .option img {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 9px;
            background: #111;
        }

        .option-text {
            min-width: 0;
        }

        .option-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
        }

        .option-year {
            margin-top: 3px;
            font-size: 10px;
            color: var(--muted);
        }

        .viewer {
            position: absolute;
            z-index: 5;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 90px 105px;
            touch-action: none;
            cursor: grab;
        }

        .viewer.dragging {
            cursor: grabbing;
        }

        .painting-wrap {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition:
                transform .35s cubic-bezier(.2,.75,.2,1);
        }

        .painting {
            display: block;
            max-width: min(78vw, 900px);
            max-height: min(72vh, 760px);
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 3px;
            box-shadow:
                0 35px 90px rgba(0,0,0,.55),
                0 8px 25px rgba(0,0,0,.35);
            transform-origin: center center;
            will-change: transform, opacity;
            transition:
                opacity .24s ease,
                filter .3s ease;
        }

        .painting.entering-next {
            animation: slideNext .4s cubic-bezier(.2,.75,.2,1);
        }

        .painting.entering-prev {
            animation: slidePrev .4s cubic-bezier(.2,.75,.2,1);
        }

        @keyframes slideNext {
            0% {
                opacity: 0;
                transform: translateX(55px) scale(.97);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes slidePrev {
            0% {
                opacity: 0;
                transform: translateX(-55px) scale(.97);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .side {
            position: absolute;
            z-index: 12;
            top: 50%;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            transform: translateY(-50%);
        }

        .side.prev {
            left: 24px;
        }

        .side.next {
            right: 24px;
        }

        .caption {
            position: absolute;
            z-index: 20;
            left: 50%;
            bottom: 25px;
            transform: translateX(-50%);
            max-width: calc(100% - 40px);
            padding: 11px 17px;
            border-radius: 15px;
            background: rgba(18,18,20,.58);
            border: 1px solid rgba(255,255,255,.1);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.06),
                0 12px 35px rgba(0,0,0,.25);
            backdrop-filter: blur(25px) saturate(140%);
            -webkit-backdrop-filter: blur(25px) saturate(140%);
            color: rgba(255,255,255,.75);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition:
                opacity .25s ease,
                transform .35s cubic-bezier(.2,.75,.2,1);
        }

        .zoom-indicator {
            position: absolute;
            z-index: 20;
            left: 50%;
            top: 88px;
            transform: translateX(-50%);
            padding: 7px 11px;
            border-radius: 11px;
            color: rgba(255,255,255,.6);
            background: rgba(15,15,17,.48);
            border: 1px solid rgba(255,255,255,.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            font-size: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease;
        }

        .zoom-indicator.visible {
            opacity: 1;
        }

        .preloader {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 700px) {
            .top {
                top: 12px;
                left: 12px;
                right: 12px;
            }

            .logo {
                width: 55%;
                max-width: 145px;
            }

            .controls {
                gap: 5px;
            }

            .button {
                width: 40px;
                height: 40px;
            }

            .selector-button {
                min-width: 44px;
                width: 44px;
                height: 40px;
                padding: 0;
                justify-content: center;
            }

            .selector-title {
                display: none;
            }

            .selector-button .chevron {
                display: none;
            }

            .dropdown {
                top: calc(100% + 8px);
                right: 0;
                width: min(270px, calc(100vw - 24px));
            }

            .viewer {
                padding: 75px 50px 80px;
            }

            .painting {
                max-width: 90vw;
                max-height: 72vh;
            }

            .side {
                width: 42px;
                height: 42px;
            }

            .side.prev {
                left: 8px;
            }

            .side.next {
                right: 8px;
            }

            .caption {
                bottom: 13px;
                max-width: calc(100% - 26px);
                font-size: 11px;
            }

            .zoom-indicator {
                top: 63px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="ambient">
        <img id="ambientImage" src="" alt="">
    </div>

    <div class="top">

        <div
            class="logo"
            onclick="window.location.href='../'">Long Records</div>

        <div class="controls">



            <div class="selector" id="selector">
                <button
                    class="selector-button"
                    onclick="toggleDropdown()"
                    aria-label="Select painting"
                >
                    <span class="selector-title" id="selectorTitle">
                        Painting
                    </span>

                    <svg class="chevron" viewBox="0 0 24 24">
                        <path
                            d="M6 9l6 6 6-6"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </button>

                <div class="dropdown" id="dropdown"></div>

            </div>



            <button
                class="glass button"
                onclick="resetZoom()"
                aria-label="Reset zoom"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M8 3H3v5"/>
                    <path d="M3 3l6 6"/>
                    <path d="M16 21h5v-5"/>
                    <path d="M21 21l-6-6"/>
                </svg>
            </button>

        </div>

    </div>

    <div
        class="viewer"
        id="viewer"
    >

        <button
            class="glass button side prev"
            onclick="previousPainting()"
            aria-label="Previous painting"
        >
            <svg viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </button>

        <div class="painting-wrap" id="paintingWrap">
            <img
                class="painting"
                id="painting"
                src=""
                alt=""
                draggable="false"
            >
        </div>

        <button
            class="glass button side next"
            onclick="nextPainting()"
            aria-label="Next painting"
        >
            <svg viewBox="0 0 24 24">
                <path d="M9 18l6-6-6-6"/>
            </svg>
        </button>

    </div>

    <div
        class="zoom-indicator"
        id="zoomIndicator"
    >
        100%
    </div>

    <div
        class="caption"
        id="caption"
    ></div>

    <div
        class="preloader"
        id="preloader"
    ></div>

</div>

<script>
    const paintings = [
        {
            title: "Ghamidi's Portrait, 2026",
            image: "prints/yj-ghamidi.png"
        },
        {
            title: "The White Paste Boy, 2026",
            image: "prints/yj-white-paste-boy.png"
        },
        {
            title: "Print One, 2026",
            image: "prints/yj-print.png"
        }
    ];

    const painting = document.getElementById("painting");
    const ambientImage = document.getElementById("ambientImage");
    const caption = document.getElementById("caption");
    const selector = document.getElementById("selector");
    const selectorTitle = document.getElementById("selectorTitle");
    const dropdown = document.getElementById("dropdown");
    const viewer = document.getElementById("viewer");
    const paintingWrap = document.getElementById("paintingWrap");
    const zoomIndicator = document.getElementById("zoomIndicator");

    let current = 0;
    let zoom = 1;
    let panX = 0;
    let panY = 0;

    let dragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let startPanX = 0;
    let startPanY = 0;

    let lastTap = 0;
    let zoomTimer;

    const cache = new Map();

    function preload(index) {
        if (index < 0 || index >= paintings.length) return;
        if (cache.has(index)) return;

        const img = new Image();
        img.src = paintings[index].image;

        cache.set(index, img);
    }

    function speculativePreload(index) {
        preload(index - 1);
        preload(index + 1);

        requestIdleCallback(() => {
            preload(index - 2);
            preload(index + 2);
        }, { timeout: 1200 });
    }

    function renderDropdown() {
        dropdown.innerHTML = paintings.map((item, index) => `
            <button
                class="option ${index === current ? "active" : ""}"
                onclick="selectPainting(${index})"
            >
                <img
                    src="${item.image}"
                    alt=""
                    loading="lazy"
                >

                <div class="option-text">
                    <div class="option-name">${item.title}</div>
                    <div class="option-year">2026</div>
                </div>
            </button>
        `).join("");
    }

    function toggleDropdown() {
        selector.classList.toggle("open");
    }

    function closeDropdown() {
        selector.classList.remove("open");
    }

    function updateZoom() {
        paintingWrap.style.transform =
            `translate3d(${panX}px, ${panY}px, 0)`;

        painting.style.transform =
            `scale(${zoom})`;

        zoomIndicator.textContent =
            `${Math.round(zoom * 100)}%`;

        zoomIndicator.classList.add("visible");

        clearTimeout(zoomTimer);

        zoomTimer = setTimeout(() => {
            zoomIndicator.classList.remove("visible");
        }, 700);
    }

    function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
    }

    function resetZoom() {
        zoom = 1;
        panX = 0;
        panY = 0;
        updateZoom();
    }

    function setZoom(value, centerX = 0, centerY = 0) {
        const oldZoom = zoom;

        zoom = clamp(value, 1, 4);

        if (zoom === 1) {
            panX = 0;
            panY = 0;
        } else if (oldZoom !== zoom) {
            const factor = (zoom / oldZoom) - 1;

            panX -= centerX * factor;
            panY -= centerY * factor;
        }

        updateZoom();
    }

    function selectPainting(index, direction = null) {
        if (index === current) {
            closeDropdown();
            return;
        }

        const oldIndex = current;

        current = index;

        const resolvedDirection =
            direction ||
            (index > oldIndex ? "next" : "prev");

        closeDropdown();

        resetZoom();

        painting.classList.remove(
            "entering-next",
            "entering-prev"
        );

        void painting.offsetWidth;

        painting.classList.add(
            resolvedDirection === "next"
                ? "entering-next"
                : "entering-prev"
        );

        const item = paintings[current];

        const nextImage = new Image();

        nextImage.onload = () => {
            painting.src = item.image;
            ambientImage.src = item.image;

            painting.alt = item.title;
            caption.textContent = item.title;
            selectorTitle.textContent = item.title;

            renderDropdown();
            speculativePreload(current);
        };

        nextImage.src = item.image;
    }

    function nextPainting() {
        selectPainting(
            (current + 1) % paintings.length,
            "next"
        );
    }

    function previousPainting() {
        selectPainting(
            (current - 1 + paintings.length) % paintings.length,
            "prev"
        );
    }

    function wheelZoom(event) {
        event.preventDefault();

        const rect = viewer.getBoundingClientRect();

        const x =
            event.clientX -
            rect.left -
            rect.width / 2;

        const y =
            event.clientY -
            rect.top -
            rect.height / 2;

        const amount = event.deltaY < 0
            ? 1.12
            : 0.89;

        setZoom(
            zoom * amount,
            x,
            y
        );
    }

    viewer.addEventListener(
        "wheel",
        wheelZoom,
        { passive: false }
    );

    viewer.addEventListener(
        "pointerdown",
        event => {
            if (event.target.closest("button")) return;

            dragging = true;

            viewer.classList.add("dragging");

            dragStartX = event.clientX;
            dragStartY = event.clientY;

            startPanX = panX;
            startPanY = panY;

            viewer.setPointerCapture(event.pointerId);
        }
    );

    viewer.addEventListener(
        "pointermove",
        event => {
            if (!dragging) return;

            const dx = event.clientX - dragStartX;
            const dy = event.clientY - dragStartY;

            if (zoom > 1) {
                panX = startPanX + dx;
                panY = startPanY + dy;

                updateZoom();
            }
        }
    );

    viewer.addEventListener(
        "pointerup",
        event => {
            if (!dragging) return;

            dragging = false;
            viewer.classList.remove("dragging");

            const dx = event.clientX - dragStartX;
            const dy = event.clientY - dragStartY;

            if (zoom <= 1 && Math.abs(dx) > 65) {
                if (dx < 0) {
                    nextPainting();
                } else {
                    previousPainting();
                }
            }
        }
    );

    viewer.addEventListener(
        "pointercancel",
        () => {
            dragging = false;
            viewer.classList.remove("dragging");
        }
    );

    viewer.addEventListener(
        "dblclick",
        event => {
            if (zoom === 1) {
                const rect = viewer.getBoundingClientRect();

                const x =
                    event.clientX -
                    rect.left -
                    rect.width / 2;

                const y =
                    event.clientY -
                    rect.top -
                    rect.height / 2;

                setZoom(2, x, y);
            } else {
                resetZoom();
            }
        }
    );

    let touchDistance = null;

    viewer.addEventListener(
        "touchstart",
        event => {
            if (event.touches.length === 2) {
                touchDistance = Math.hypot(
                    event.touches[0].clientX -
                    event.touches[1].clientX,

                    event.touches[0].clientY -
                    event.touches[1].clientY
                );
            }
        },
        { passive: true }
    );

    viewer.addEventListener(
        "touchmove",
        event => {
            if (event.touches.length !== 2) return;

            event.preventDefault();

            const distance = Math.hypot(
                event.touches[0].clientX -
                event.touches[1].clientX,

                event.touches[0].clientY -
                event.touches[1].clientY
            );

            if (touchDistance) {
                const ratio =
                    distance / touchDistance;

                setZoom(
                    zoom * ratio
                );
            }

            touchDistance = distance;
        },
        { passive: false }
    );

    viewer.addEventListener(
        "touchend",
        () => {
            touchDistance = null;
        }
    );

    document.addEventListener(
        "keydown",
        event => {
            if (event.key === "ArrowRight") {
                nextPainting();
            }

            if (event.key === "ArrowLeft") {
                previousPainting();
            }

            if (event.key === "Escape") {
                closeDropdown();
                resetZoom();
            }

            if (event.key === "+" || event.key === "=") {
                setZoom(zoom * 1.15);
            }

            if (event.key === "-") {
                setZoom(zoom * .87);
            }

            if (event.key === "0") {
                resetZoom();
            }
        }
    );

    document.addEventListener(
        "click",
        event => {
            if (!selector.contains(event.target)) {
                closeDropdown();
            }
        }
    );

    let touchStartX = 0;

    viewer.addEventListener(
        "touchstart",
        event => {
            if (event.touches.length === 1) {
                touchStartX =
                    event.touches[0].clientX;
            }
        },
        { passive: true }
    );

    viewer.addEventListener(
        "touchend",
        event => {
            if (zoom > 1) return;

            const touch =
                event.changedTouches[0];

            const dx =
                touch.clientX - touchStartX;

            if (Math.abs(dx) > 60) {
                if (dx < 0) {
                    nextPainting();
                } else {
                    previousPainting();
                }
            }
        },
        { passive: true }
    );

    function init() {
        renderDropdown();

        painting.src = paintings[0].image;
        ambientImage.src = paintings[0].image;

        painting.alt = paintings[0].title;
        caption.textContent = paintings[0].title;
        selectorTitle.textContent = paintings[0].title;

        preload(0);
        preload(1);
    }

    init();
</script>

</body>
</html>
